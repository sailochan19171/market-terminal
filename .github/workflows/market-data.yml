# The data pipeline, running on GitHub's machines instead of one PC.
#
# Every 15 minutes it pulls the exchanges' latest announcements, reads any new order filing out of its PDF, and
# writes both straight into the hosted Turso database the site reads from (MARKET_DB=turso). After the close it
# also pulls the day's prices and the rest of NSE's corporate feeds. So the site keeps gaining data whether or not
# any particular computer is switched on.
#
# The PC at home can keep running the same jobs: both write the same rows keyed by announcement id, so whichever
# gets there first wins and the other simply finds nothing new.
#
# Secrets this needs (Settings -> Secrets and variables -> Actions):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN   the hosted database
#   LLM_API_KEY                            the model that reads the order PDFs (optional: without it the
#                                          pattern reader still fills in values and customers)
name: Market data

# Every fifteen minutes, around the clock: a public repository's Actions minutes are unlimited, so the only
# thing that sets the pace is how soon a filing should appear on the site.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}        # and on demand, from the Actions tab

concurrency:
  group: market-data
  cancel-in-progress: false    # never cut a run short; queue the next one instead

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    env:
      MARKET_DB: turso
      MARKET_JOBS: "off"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      LLM_PROVIDER: groq
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: openai/gpt-oss-120b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm install` rather than `npm ci`: the runner's npm resolves a slightly different tree from the one
      # this lock file was written with, and a dependency mismatch should not stop the day's data.
      - run: npm install --no-audit --no-fund

      # Announcements and the orders inside them, several times over inside one run.
      #
      # The schedule above asks for every fifteen minutes and GitHub does not deliver it: a free account's
      # scheduled runs are queued behind everything else and quietly dropped under load, and this job has been
      # arriving every three to five hours. Nothing can make the scheduler punctual - but a run that lasts an
      # hour and sweeps six times covers most of that gap itself, and a public repository's minutes are free.
      #
      # Each sweep: BSE's filings for the last month (a day already pulled is skipped, so the reach is cheap
      # and a fortnight's outage still repairs itself), NSE's for both boards, then the order wins read out of
      # whatever arrived. NSE is allowed to fail - its API refuses a datacentre more often than BSE's - and the
      # status step at the end still fails the run if a dataset has actually fallen behind.
      - name: Announcements and orders, swept every ten minutes for an hour
        run: |
          for pass in 1 2 3 4 5 6; do
            echo "::group::sweep $pass"
            started=$(date +%s)
            npx tsx src/server/cli.ts announcements --years 0.08 || echo "BSE announcements failed on sweep $pass"
            npx tsx src/server/cli.ts nse-corporate --only announcements --years 0.06 || echo "NSE announcements failed on sweep $pass"
            npx tsx scripts/orders-backfill.ts 7 40 || echo "order reading failed on sweep $pass"
            echo "::endgroup::"
            if [ "$pass" -lt 6 ]; then
              # Ten minutes from the start of the sweep, not from its end, so a slow sweep does not push the
              # next one out; a sweep that overran simply starts the next at once.
              wait_for=$(( 600 - ($(date +%s) - started) ))
              [ "$wait_for" -gt 0 ] && sleep "$wait_for"
            fi
          done

      # The order book each company reports to its investors, off the quarterly presentation. Presentations
      # arrive in bursts after each quarter, and a deck is downloaded once and remembered whatever it said, so
      # most runs have nothing to do; a run costs a handful of model calls at most.
      - name: Order books from investor presentations
        continue-on-error: true
        run: npx tsx scripts/orderbook-backfill.ts 400 15

      # The day's prices. Both exchanges publish one file after the close (about 18:00 IST), so there is nothing
      # new to fetch during the session; a run that finds the file already stored does nothing. Every dataset
      # below used to come only from the PC at home, which is why prices stopped the moment it stopped.
      - name: BSE daily prices
        continue-on-error: true
        run: npx tsx src/server/cli.ts bhavcopy --years 0.02

      - name: NSE daily prices
        continue-on-error: true
        run: npx tsx src/server/cli.ts nse-bhavcopy --years 0.02

      # Corporate actions, board meetings, results and insider dealings. Quarterly and event-driven, so they are
      # cheap to re-check and a missed day costs nothing; shareholding is left to the deeper sync, which walks
      # every company's filing history rather than a date window.
      - name: NSE corporate feeds
        continue-on-error: true
        run: npx tsx src/server/cli.ts nse-corporate --only actions,board-meetings,results,integrated-results,insider

      - name: BSE corporate actions
        continue-on-error: true
        run: npx tsx src/server/cli.ts corp-actions

      # Fails the run when any dataset has fallen behind, whatever the steps above reported. A green run over
      # two-day-old prices is worse than a red one, because nobody goes looking for a problem the log denies.
      - name: What the run found
        if: always()
        run: npx tsx scripts/pipeline-status.ts --strict
